<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B2L1 互動單字記憶卡</title>
    <style>
        :root {
            --primary-color: #2C3E50; /* 深海藍 */
            --accent-color: #E67E22;  /* 活力橘 */
            --bg-color: #F4F7F6;
            --card-front: #FFFFFF;
            --card-back: #FDFEFE;
        }

        body {
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            margin-bottom: 30px;
            text-align: center;
        }

        h1 {
            color: var(--primary-color);
            font-size: 2.2rem;
            margin-bottom: 10px;
        }

        /* 響應式網格設計 */
        .vocab-grid {
            display: grid;
            gap: 25px;
            width: 100%;
            max-width: 1000px;
            /* 電腦版：2欄 */
            grid-template-columns: repeat(2, 1fr);
        }

        @media (max-width: 768px) {
            /* 手機版：1欄 */
            .vocab-grid {
                grid-template-columns: 1fr;
            }
        }

        /* 3D 卡片效果 */
        .card-container {
            perspective: 1000px;
            height: 380px;
            cursor: pointer;
        }

        .card {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        .card.is-flipped {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 15px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* 正面樣式 */
        .card-front {
            background-color: var(--card-front);
        }

        .sprite-img {
            width: 100%;
            aspect-ratio: 16 / 9;
            background-repeat: no-repeat;
            background-size: 400% 400%; /* 4x4 網格 */
            border-bottom: 2px solid #EEE;
        }

        .word-info {
            flex: 1;
            padding: 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .word-en {
            font-size: 2rem;
            font-weight: bold;
            color: var(--primary-color);
            margin: 0;
        }

        .word-ph {
            font-size: 1.1rem;
            color: #7F8C8D;
            margin-top: 5px;
        }

        /* 背面樣式 */
        .card-back {
            background-color: var(--card-back);
            transform: rotateY(180deg);
            padding: 25px;
            box-sizing: border-box;
            border: 3px solid var(--primary-color);
        }

        .word-meta {
            margin-bottom: 15px;
            border-bottom: 1px solid #EEE;
            padding-bottom: 10px;
        }

        .word-pos-cn {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--primary-color);
        }

        .word-strategy {
            font-size: 0.9rem;
            background: #E8F0FE;
            color: #1A73E8;
            padding: 3px 10px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 15px;
        }

        .word-mnemonic {
            font-size: 1.2rem;
            color: var(--accent-color);
            line-height: 1.6;
            background: rgba(230, 126, 34, 0.1);
            padding: 15px;
            border-radius: 10px;
            border-left: 5px solid var(--accent-color);
            margin-top: auto;
        }

        .word-ex {
            font-size: 0.95rem;
            color: #34495E;
            font-style: italic;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<header>
    <h1>🧠 B2L1 互動單字記憶卡</h1>
    <p>點擊卡片翻面並聆聽發音</p>
</header>

<div class="vocab-grid" id="vocabGrid">
    </div>

<script>
    const G1_URL = "https://raw.githubusercontent.com/terenceylhc/vocB2/main/B2L1G1.jpg";
    const G2_URL = "https://raw.githubusercontent.com/terenceylhc/vocB2/main/B2L1G2.jpg";

    const vocabularyData = [
        { en: "attraction", ph: "[əˋtrækʃən]", cn: "有吸引力的景點", ex: "Jiufen is a very popular tourist attraction in Taiwan.", grid: 1, pos: 1, strategy: "諧音", mnemonic: "阿！扯(A-trac)到一頭金牛來吸引遊客。" },
        { en: "local", ph: "[ˋlokḷ]", cn: "當地的/當地人", ex: "Our hotel is close to the local beach.", grid: 1, pos: 2, strategy: "諧音", mnemonic: "當地的阿伯「摟扣」(Lō-khò) 在乘涼。" },
        { en: "plain", ph: "[plen]", cn: "樸素的", ex: "Lady Gaga wore a plain dress to the party.", grid: 1, pos: 3, strategy: "聯想", mnemonic: "這件衣服像「平」原 (Plain) 一樣樸素。" },
        { en: "counter", ph: "[ˋkaᴜntɚ]", cn: "櫃臺", ex: "People are waiting in front of the counter to get a free gift.", grid: 1, pos: 4, strategy: "諧音", mnemonic: "在櫃檯「看她」(Kàn tā) 結帳。" },
        { en: "hug", ph: "[hʌg]", cn: "擁抱", ex: "The couple hug each other every time they meet.", grid: 1, pos: 5, strategy: "諧音", mnemonic: "「哈哥」(Hagrid) 在給哈利波特一個大擁抱。" },
        { en: "pleased", ph: "[plizd]", cn: "高興的", ex: "Ann was not pleased with her fries at the restaurant.", grid: 1, pos: 6, strategy: "諧音", mnemonic: "拿到「普里茲」(Pritz) 獎好高興。" },
        { en: "mood", ph: "[mud]", cn: "心情", ex: "Justin is in a good mood because the long weekend is coming.", grid: 1, pos: 7, strategy: "諧音", mnemonic: "心情好就去「牧」(Mood) 場看牛。" },
        { en: "unfairly", ph: "[ʌnˋfɛrlɪ]", cn: "不公平地", ex: "Daniel is angry about being treated unfairly by his boss.", grid: 1, pos: 8, strategy: "諧音", mnemonic: "這「案非常」(Un-fair) 不公平，天秤歪掉了。" },
        { en: "observe", ph: "[əbˋzɝv]", cn: "觀察", ex: "He started to observe the people in the store.", grid: 1, pos: 9, strategy: "諧音", mnemonic: "阿伯樂在觀察美麗的蝴蝶。" },
        { en: "customer", ph: "[ˋkʌstəmɚ]", cn: "顧客", ex: "The shop serves customers till 5 p.m. every day.", grid: 1, pos: 10, strategy: "諧音", mnemonic: "顧客太多，百貨門口「卡死他媽」了。" },
        { en: "seem", ph: "[sim]", cn: "好像/似乎", ex: "Larry seems to have a new girlfriend.", grid: 1, pos: 11, strategy: "諧音", mnemonic: "這「西」(See-m) 瓜看起來好像是真的，其實是蛋糕。" },
        { en: "reveal", ph: "[rɪˋvil]", cn: "揭露/透露", ex: "The news reveals that the convenience store will hold a special event.", grid: 1, pos: 12, strategy: "字根拆解", mnemonic: "除去(re-) 面紗(veil)，真相被揭露。" },
        { en: "secret", ph: "[ˋsikrɪt]", cn: "秘密", ex: "Helen is good at keeping secrets.", grid: 1, pos: 13, strategy: "諧音", mnemonic: "守住這個秘密守得很「水氣」(suí-khì)。" },
        { en: "amazed", ph: "[əˋmezd]", cn: "感到驚奇的", ex: "I am really amazed by its new trick.", grid: 1, pos: 14, strategy: "諧音", mnemonic: "看到「阿妹」(A-Mei) 唱歌，大家驚奇得掉下巴。" },
        { en: "earn", ph: "[ɝn]", cn: "賺得", ex: "This earns him many friends.", grid: 1, pos: 15, strategy: "諧音", mnemonic: "用力「恩」(Earn) 的一聲，賺到金幣。" },
        { en: "café", ph: "[kəˋfe]", cn: "咖啡店", ex: "Let's meet at the café near the station.", grid: 1, pos: 16, strategy: "諧音", mnemonic: "在「咖啡」店喝咖啡。" },
        { en: "euro", ph: "[ˋjᴜro]", cn: "歐元", ex: "The coffee costs three euros.", grid: 2, pos: 1, strategy: "諧音", mnemonic: "「有肉」(eu-ro) 吃就要用歐元買。" },
        { en: "nationality", ph: "[͵næʃəˋnælətɪ]", cn: "國籍", ex: "What is your nationality?", grid: 2, pos: 2, strategy: "諧音", mnemonic: "「奶昔拿去」(na-tion-ali-ty) 給不同國籍的人喝。" },
        { en: "pay off", ph: "[pe ɔf]", cn: "得到好結果", ex: "Eva’s efforts to improve her grades finally paid off.", grid: 2, pos: 3, strategy: "諧音", mnemonic: "努力「賠」(pay) 到「光」(off)，最後卻贏到翻倍。" },
        { en: "right away", ph: "[raɪt əˋwe]", cn: "立刻/馬上", ex: "His fans ran to him right away.", grid: 2, pos: 4, strategy: "諧音", mnemonic: "「萊特」(right) 兄弟「阿威」(away) 立刻起飛。" },
        { en: "stand out", ph: "[stænd aʊt]", cn: "突出/出眾", ex: "The silver one stands out because of its camera.", grid: 2, pos: 5, strategy: "諧音", mnemonic: "「死站在外面」(stand out) 的人最突出。" },
        { en: "burst out", ph: "[bɝst aʊt]", cn: "突然...", ex: "The boy burst out laughing on the MRT.", grid: 2, pos: 6, strategy: "諧音", mnemonic: "「巴士」(burst) 撞「掉」(out) 牆壁，突然衝出來。" },
        { en: "have nothing to do with", ph: "[hæv ˋnʌθɪŋ tə du wɪð]", cn: "與...無關", ex: "His job has nothing to do with acting.", grid: 2, pos: 7, strategy: "諧音", mnemonic: "這裡「拿不到」(nothing to do) 東西，與我無關。" }
    ];

    function getSpritePos(pos) {
        const x = (pos - 1) % 4;
        const y = Math.floor((pos - 1) / 4);
        return `${(x * 33.333).toFixed(3)}% ${(y * 33.333).toFixed(3)}%`;
    }

    const gridEl = document.getElementById('vocabGrid');

    vocabularyData.forEach(item => {
        const container = document.createElement('div');
        container.className = 'card-container';
        
        const card = document.createElement('div');
        card.className = 'card';
        
        const bgUrl = item.grid === 1 ? G1_URL : G2_URL;
        const bgPos = getSpritePos(item.pos);

        card.innerHTML = `
            <div class="card-front">
                <div class="sprite-img" style="background-image: url('${bgUrl}'); background-position: ${bgPos};"></div>
                <div class="word-info">
                    <p class="word-en">${item.en}</p>
                    <p class="word-ph">${item.ph}</p>
                </div>
            </div>
            <div class="card-back">
                <div class="word-meta">
                    <span class="word-pos-cn">${item.cn}</span>
                </div>
                <div class="word-strategy">${item.strategy}</div>
                <div class="word-mnemonic">${item.mnemonic}</div>
                <div class="word-ex">${item.ex}</div>
            </div>
        `;

        container.onclick = () => {
            const isFlipped = card.classList.toggle('is-flipped');
            if (isFlipped) {
                const msg = new SpeechSynthesisUtterance(item.en);
                msg.lang = 'en-US';
                msg.rate = 0.9;
                window.speechSynthesis.speak(msg);
            }
        };

        container.appendChild(card);
        gridEl.appendChild(container);
    });
</script>

</body>
</html>
