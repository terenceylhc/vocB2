<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🧠 B2L1 互動單字記憶卡</title>
    <style>
        :root {
            --primary: #2C3E50;
            --accent: #E67E22;
            --bg: #F4F7F6;
            --white: #FFFFFF;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg);
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 修正手機標題換行 */
        h1 {
            color: var(--primary);
            margin: 20px 0;
            font-size: clamp(1.2rem, 5vw, 2rem);
            text-align: center;
            width: 100%;
            white-space: nowrap;
        }

        .vocab-grid {
            display: grid;
            gap: 20px;
            width: 100%;
            max-width: 1000px;
            grid-template-columns: repeat(2, 1fr);
        }

        @media (max-width: 768px) {
            .vocab-grid { grid-template-columns: 1fr; }
        }

        .card { height: 400px; perspective: 1000px; cursor: pointer; }

        .card-inner {
            position: relative;
            width: 100%; height: 100%;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
            border-radius: 15px;
        }

        .card.is-flipped .card-inner { transform: rotateY(180deg); }

        .card-front, .card-back {
            position: absolute;
            width: 100%; height: 100%;
            backface-visibility: hidden;
            border-radius: 15px;
            background: var(--white);
            overflow: hidden;
            display: flex; flex-direction: column;
        }

        .card-back {
            transform: rotateY(180deg);
            padding: 20px;
            justify-content: center;
            border: 2px solid var(--primary);
        }

        /* 影像區域 (使用直接連結優化載入) */
        .sprite-img {
            width: 100%;
            aspect-ratio: 16 / 9;
            background-repeat: no-repeat;
            background-size: 400% 400%;
            background-color: #eee;
        }

        .front-content { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 10px; }
        
        .word-header { display: flex; align-items: center; gap: 10px; margin-bottom: 5px; }
        .word-text { font-size: 1.8rem; font-weight: 800; color: var(--primary); }

        .btn-audio {
            background: var(--primary); color: white; border: none;
            width: 32px; height: 32px; border-radius: 50%;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
        }

        .phonetic { font-size: 1rem; color: #7F8C8D; }

        .back-title { font-size: 2rem; font-weight: 800; color: var(--primary); text-align: center; }
        .back-pos { font-style: italic; color: #95A5A6; text-align: center; margin-bottom: 10px; }
        .back-mean { font-size: 1.4rem; font-weight: bold; text-align: center; margin-bottom: 15px; }
        
        .back-strategy-box { background: #F8F9F9; padding: 10px; border-radius: 8px; margin-bottom: 10px; font-size: 0.9rem; }
        .mnemonic-box { 
            background: #FEF5ED; padding: 12px; border-radius: 10px; 
            border-left: 5px solid var(--accent); color: var(--accent);
            font-weight: bold; font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <h1>🧠 B2L1 互動單字記憶卡</h1>
    <div class="vocab-grid" id="mainGrid"></div>

    <script>
        // 1. 更穩定的圖片網址格式 (使用 raw.githubusercontent.com)
        const imgUrls = [
            "https://raw.githubusercontent.com/terenceylhc/vocB2/main/B2L1G1.jpg",
            "https://raw.githubusercontent.com/terenceylhc/vocB2/main/B2L1G2.jpg"
        ];

        // 2. 原始單字資料 (已按照順序排列)
        const vocabData = [
            { en: "attraction", ph: "[əˋtrækʃən]", cn: "有吸引力的景點", grid: 1, pos: 1, strategy: "諧音 (台語/國語)", mnemonic: "阿！扯(A-trac)到一頭金牛來吸引遊客。", pos_tag: "n." },
            { en: "local", ph: "[ˋlokḷ]", cn: "當地的/當地人", grid: 1, pos: 2, strategy: "諧音 (台語)", mnemonic: "當地的阿伯「摟扣」(Lō-khò) 在乘涼。", pos_tag: "adj./n." },
            { en: "plain", ph: "[plen]", cn: "樸素的", grid: 1, pos: 3, strategy: "聯想", mnemonic: "這件衣服像「平」原 (Plain) 一樣樸素。", pos_tag: "adj." },
            { en: "counter", ph: "[ˋkaᴜntɚ]", cn: "櫃臺", grid: 1, pos: 4, strategy: "諧音 (國語)", mnemonic: "在櫃檯「看她」(Kàn tā) 結帳。", pos_tag: "n." },
            { en: "hug", ph: "[hʌg]", cn: "擁抱", grid: 1, pos: 5, strategy: "諧音 (國語)", mnemonic: "「哈哥」(Hagrid) 在給哈利波特一個大擁抱。", pos_tag: "vt./n." },
            { en: "pleased", ph: "[plizd]", cn: "高興的", grid: 1, pos: 6, strategy: "諧音 (國語)", mnemonic: "拿到「普里茲」(Pritz) 獎好高興。", pos_tag: "adj." },
            { en: "mood", ph: "[mud]", cn: "心情", grid: 1, pos: 7, strategy: "諧音 (國語)", mnemonic: "心情好就去「牧」(Mood) 場看牛。", pos_tag: "n." },
            { en: "unfairly", ph: "[ʌnˋfɛrlɪ]", cn: "不公平地", grid: 1, pos: 8, strategy: "諧音 (國語)", mnemonic: "這「案非常」(Un-fair) 不公平，天秤歪掉了。", pos_tag: "adv." },
            { en: "observe", ph: "[əbˋzɝv]", cn: "觀察", grid: 1, pos: 9, strategy: "諧音 (國語)", mnemonic: "阿伯樂在觀察美麗的蝴蝶。", pos_tag: "vt." },
            { en: "customer", ph: "[ˋkʌstəmɚ]", cn: "顧客", grid: 1, pos: 10, strategy: "諧音 (國語)", mnemonic: "顧客太多，百貨門口「卡死他媽」了。", pos_tag: "n." },
            { en: "seem", ph: "[sim]", cn: "好像/似乎", grid: 1, pos: 11, strategy: "諧音 (國語)", mnemonic: "這「西」(See-m) 瓜看起來好像是真的，其實是蛋糕。", pos_tag: "vi." },
            { en: "reveal", ph: "[rɪˋvil]", cn: "揭露/透露", grid: 1, pos: 12, strategy: "字根拆解", mnemonic: "除去(re-) 面紗(veil)，真相被揭露。", pos_tag: "vt." },
            { en: "secret", ph: "[ˋsikrɪt]", cn: "秘密", grid: 1, pos: 13, strategy: "諧音 (台語)", mnemonic: "守住這個秘密守得很「水氣」(suí-khì)。", pos_tag: "n./adj." },
            { en: "amazed", ph: "[əˋmezd]", cn: "感到驚奇的", grid: 1, pos: 14, strategy: "諧音 (國語)", mnemonic: "看到「阿妹」(A-Mei) 唱歌，大家驚奇得掉下巴。", pos_tag: "adj." },
            { en: "earn", ph: "[ɝn]", cn: "賺得", grid: 1, pos: 15, strategy: "諧音 (國語)", mnemonic: "用力「恩」(Earn) 的一聲，賺到金幣。", pos_tag: "vt." },
            { en: "café", ph: "[kəˋfe]", cn: "咖啡店", grid: 1, pos: 16, strategy: "諧音 (國語)", mnemonic: "在「咖啡」店喝咖啡。", pos_tag: "n." },
            { en: "euro", ph: "[ˋjᴜro]", cn: "歐元", grid: 2, pos: 1, strategy: "諧音 (國語)", mnemonic: "「有肉」(eu-ro) 吃就要用歐元買。", pos_tag: "n." },
            { en: "nationality", ph: "[͵næʃəˋnælətɪ]", cn: "國籍", grid: 2, pos: 2, strategy: "諧音 (國語)", mnemonic: "「奶昔拿去」(na-tion-ali-ty) 給不同國籍的人喝。", pos_tag: "n." },
            { en: "pay off", ph: "[pe ɔf]", cn: "得到好結果", grid: 2, pos: 3, strategy: "諧音 (國語)", mnemonic: "努力「賠」(pay) 到「光」(off)，最後卻贏到翻倍。", pos_tag: "phr." },
            { en: "right away", ph: "[raɪt əˋwe]", cn: "立刻/馬上", grid: 2, pos: 4, strategy: "諧音 (國語)", mnemonic: "「萊特」(right) 兄弟「阿威」(away) 立刻起飛。", pos_tag: "phr." },
            { en: "stand out", ph: "[stænd aʊt]", cn: "突出/出眾", grid: 2, pos: 5, strategy: "諧音 (國語)", mnemonic: "「死站在外面」(stand out) 的人最突出。", pos_tag: "phr." },
            { en: "burst out", ph: "[bɝst aʊt]", cn: "突然...", grid: 2, pos: 6, strategy: "諧音 (國語)", mnemonic: "「巴士」(burst) 撞「掉」(out) 牆壁，突然衝出來。", pos_tag: "phr." },
            { en: "have nothing to do with", ph: "[hæv ˋnʌθɪŋ tə du wɪð]", cn: "與...無關", grid: 2, pos: 7, strategy: "諧音 (國語)", mnemonic: "這裡「拿不到」(nothing to do) 東西，與我無關。", pos_tag: "phr." }
        ];

        function speak(text) {
            if (!window.speechSynthesis) return;
            window.speechSynthesis.cancel();
            const msg = new SpeechSynthesisUtterance(text);
            msg.lang = 'en-US';
            window.speechSynthesis.speak(msg);
        }

        const gridContainer = document.getElementById('mainGrid');

        // 直接遍歷 vocabData (取消隨機)
        vocabData.forEach(item => {
            const card = document.createElement('div');
            card.className = 'card';
            
            const col = (item.pos - 1) % 4;
            const row = Math.floor((item.pos - 1) / 4);
            const xOffset = (col / 3) * 100;
            const yOffset = (row / 3) * 100;
            const targetImg = imgUrls[item.grid - 1];

            card.innerHTML = `
                <div class="card-inner">
                    <div class="card-front">
                        <div class="sprite-img" style="background-image: url('${targetImg}'); background-position: ${xOffset}% ${yOffset}%;"></div>
                        <div class="front-content">
                            <div class="word-header">
                                <span class="word-text">${item.en}</span>
                                <button class="btn-audio" onclick="event.stopPropagation(); speak('${item.en}')">🔊</button>
                            </div>
                            <div class="phonetic">${item.ph}</div>
                        </div>
                    </div>
                    <div class="card-back">
                        <div class="back-title">${item.en}</div>
                        <div class="back-pos">${item.pos_tag}</div>
                        <div class="back-mean">${item.cn}</div>
                        <div class="back-strategy-box"><strong>💡 策略：</strong>${item.strategy}</div>
                        <div class="mnemonic-box">${item.mnemonic}</div>
                    </div>
                </div>
            `;

            card.onclick = () => {
                const flipped = card.classList.toggle('is-flipped');
                if (flipped) setTimeout(() => speak(item.en), 100);
            };
            gridContainer.appendChild(card);
        });
    </script>
</body>
</html>
