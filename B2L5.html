<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧠 B2L5 互動單字記憶卡</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f1f5f9; /* slate-100 */
        }
        
        /* 高度自適應翻轉卡片核心技術 (CSS Grid Layering) */
        .flip-card-container {
            perspective: 1000px;
            /* 讓容器成為 Grid，讓正反面疊在同一個網格位置 */
            display: grid; 
            cursor: pointer;
        }

        .flip-card-face {
            grid-area: 1 / 1;
            backface-visibility: hidden;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
        }

        .flip-card-front {
            transform: rotateY(0deg);
            z-index: 2;
        }

        .flip-card-back {
            transform: rotateY(-180deg);
        }

        /* 翻轉狀態 */
        .flip-card-container.flipped .flip-card-front {
            transform: rotateY(180deg);
        }
        .flip-card-container.flipped .flip-card-back {
            transform: rotateY(0deg);
        }

        /* 終極版：置中溢位裁切技術 (Deep Centered Safe Zone Cropping) */
        .sprite-img {
            background-size: 400% 400%; /* 回歸 400% 完美網格定位 */
            background-repeat: no-repeat;
            /* 將放大倍率提升至 1.1 (10%)，確保能把原圖較粗的白色/黑色分隔線完全裁切掉 */
            transform: scale(1.1); 
            transform-origin: center center;
        }
    </style>
</head>
<body class="min-h-screen py-10 px-4">

    <div class="max-w-7xl mx-auto">
        <header class="text-center mb-12">
            <h1 class="text-4xl md:text-5xl font-black text-[#0f172a] mb-4">🧠 B2L5 互動單字記憶卡</h1>
            <p class="text-slate-500 text-lg">點擊卡片翻面並聆聽發音，利用圖像與口訣加深記憶！</p>
        </header>

        <!-- 卡片網格容器：移除 items-start，改用 items-stretch 強制同一列的卡片高度保持一致 -->
        <div id="card-grid" class="grid grid-cols-1 md:grid-cols-2 gap-8 items-stretch">
            <!-- 卡片將由 JavaScript 動態生成 -->
        </div>
    </div>

    <script>
        const vocabData = [
          {
            "en": "costume",
            "ph": "[ˋkɑstum]",
            "pos": "n.",
            "cn": "(特殊場合的) 服裝",
            "strategy": "諧音記憶法(卡式提)",
            "mnemonic": "提著一台舊卡式錄音機（卡式提），身上卻穿著超級瑪利歐的服裝，這混搭太有型了！",
            "ex": "Ted went to the Halloween party in a Super Mario costume.",
            "grid": 1,
            "pos_idx": 0
          },
          {
            "en": "ability",
            "ph": "[əˋbɪlətɪ]",
            "pos": "n.",
            "cn": "才能",
            "strategy": "諧音記憶法(鵝比例)",
            "mnemonic": "這隻巨鵝調配調酒的比例精準，展現驚人的調酒才能。",
            "ex": "The girl is known for her language ability.",
            "grid": 1,
            "pos_idx": 1
          },
          {
            "en": "weakness",
            "ph": "[ˋwiknɪs]",
            "pos": "n.",
            "cn": "缺點，弱點",
            "strategy": "諧音記憶法(餵雞女士)",
            "mnemonic": "餵雞女士在尼斯湖畔瘋狂餵雞，把雞餵得太重飛不起來，是牠致命的缺點與弱點。",
            "ex": "This scooter only has one weakness—it is too heavy for me.",
            "grid": 1,
            "pos_idx": 2
          },
          {
            "en": "personal",
            "ph": "[ˋpɝsṇḷ]",
            "pos": "adj.",
            "cn": "個人的，私人的",
            "strategy": "字根字首拆解(person人 + al形容詞字尾)",
            "mnemonic": "每個人（person）都有不穿制服、屬於個人的、私人的生活空間。",
            "ex": "Ann seldom talks about her personal life, so we know very little about her.",
            "grid": 1,
            "pos_idx": 3
          },
          {
            "en": "normal",
            "ph": "[ˋnɔrmḷ]",
            "pos": "adj.",
            "cn": "一般的，正常的",
            "strategy": "諧音記憶法(鬧貓)",
            "mnemonic": "天天在房間鬧貓，這對一個貓奴來說是非常正常的、一般的行為。",
            "ex": "It is normal for the boy to feel sad when his pet dies.",
            "grid": 1,
            "pos_idx": 4
          },
          {
            "en": "murder",
            "ph": "[ˋmɝdɚ]",
            "pos": "vt.",
            "cn": "謀殺",
            "strategy": "諧音記憶法(沒得)",
            "mnemonic": "凶手心狠手辣，讓被害人沒得商量就被謀殺了。",
            "ex": "After the pop star was murdered, all of his fans cried over his death.",
            "grid": 1,
            "pos_idx": 5
          },
          {
            "en": "depressed",
            "ph": "[dɪˋprɛst]",
            "pos": "adj.",
            "cn": "沮喪的，憂鬱的",
            "strategy": "字根字首拆解(de向下 + press按壓)",
            "mnemonic": "心情不斷被向下（de）按壓（press），整個人變得非常沮喪的、憂鬱的。",
            "ex": "Gina just broke up with her boyfriend, and she was very depressed about it.",
            "grid": 1,
            "pos_idx": 6
          },
          {
            "en": "crime",
            "ph": "[kraɪm]",
            "pos": "n.",
            "cn": "犯罪，罪行",
            "strategy": "諧音記憶法(哭罵)",
            "mnemonic": "因為網路犯罪被警察抓走，媽媽在一旁痛苦地哭罵。",
            "ex": "Today, computer crime is a big problem. A lot of people use viruses to attack others’ computers.",
            "grid": 1,
            "pos_idx": 7
          },
          {
            "en": "anger",
            "ph": "[ˋæŋgɚ]",
            "pos": "n.",
            "cn": "憤怒，生氣",
            "strategy": "圖像記憶法(Anger發音像「按個」)",
            "mnemonic": "因為太過憤怒與生氣，他用力「按個」傳送鍵，發出了大段罵人訊息。",
            "ex": "Ben sent a long message to Jane in anger because she forgot about their date.",
            "grid": 1,
            "pos_idx": 8
          },
          {
            "en": "protect",
            "ph": "[prəˋtɛkt]",
            "pos": "vt.",
            "cn": "保護",
            "strategy": "諧音記憶法(破鐵殼)",
            "mnemonic": "穿上這件破鐵殼盔，就能在戰場上保護自己。",
            "ex": "My brother wore a mask to protect himself from the dirty air.",
            "grid": 1,
            "pos_idx": 9
          },
          {
            "en": "childhood",
            "ph": "[ˋtʃaɪld͵hᴜd]",
            "pos": "n.",
            "cn": "童年，孩童時期",
            "strategy": "字根字首拆解(child兒童 + hood狀態/時期)",
            "mnemonic": "戴著斗篷（hood）的兒童（child），正在享受他無憂無慮的童年。",
            "ex": "I had a lovely blanket in my childhood, but it is gone now.",
            "grid": 1,
            "pos_idx": 10
          },
          {
            "en": "female",
            "ph": "[ˋfimel]",
            "pos": "adj.",
            "cn": "女性的",
            "strategy": "字根字首拆解(fe費 + male男性)",
            "mnemonic": "女性的專用廁所門口，掛著一個漂亮的女性洋裝圖標。",
            "ex": "According to the report, there are fewer female taxi drivers than male ones.",
            "grid": 1,
            "pos_idx": 11
          },
          {
            "en": "respect",
            "ph": "[rɪˋspɛkt]",
            "pos": "vt.",
            "cn": "尊敬",
            "strategy": "字根字首拆解(re重複 + spect看)",
            "mnemonic": "因為對他充滿尊敬，大家反覆（re）看著（spect）他的善舉影片並紛紛鞠躬。",
            "ex": "Many people respect Jam Hsiao for his acts of kindness.",
            "grid": 1,
            "pos_idx": 12
          },
          {
            "en": "emotion",
            "ph": "[ɪˋmoʃən]",
            "pos": "n.",
            "cn": "情緒，情感",
            "strategy": "字根字首拆解(e外出 + motion移動)",
            "mnemonic": "他無法隱藏內心的情緒，喜怒哀樂都像齒輪一樣往外轉動。",
            "ex": "Mike is not good at hiding his emotions. Everyone knows if he is happy or sad.",
            "grid": 1,
            "pos_idx": 13
          },
          {
            "en": "negative",
            "ph": "[ˋnɛgətɪv]",
            "pos": "adj.",
            "cn": "不好的，負面的",
            "strategy": "諧音記憶法(那個鵜鶘)",
            "mnemonic": "那個鵜鶘在動物園裡竟然大口把同事（水豚）吃掉，這真是一種不可取、不好的、負面的行為！",
            "ex": "Going to bed late has a negative effect on the human body.",
            "grid": 1,
            "pos_idx": 14
          },
          {
            "en": "superhero",
            "ph": "[ˋsupɚ͵hɪro]",
            "pos": "n.",
            "cn": "超級英雄",
            "strategy": "字根字首拆解(super超級 + hero英雄)",
            "mnemonic": "穿著拉風斗篷的超級英雄，雙手叉腰傲然站立在摩天大樓頂端保護城市。",
            "ex": "Iron Man is a famous superhero who saves the world.",
            "grid": 2,
            "pos_idx": 0
          },
          {
            "en": "high-tech",
            "ph": "[͵haɪˋtɛk]",
            "pos": "adj.",
            "cn": "高科技的",
            "strategy": "諧音記憶法(嗨！泰克)",
            "mnemonic": "對著那台會飛的高科技的機器人熱情大喊：「嗨！泰克（機器人的名字）！」",
            "ex": "This modern hospital uses a lot of high-tech equipment.",
            "grid": 2,
            "pos_idx": 1
          },
          {
            "en": "weapon",
            "ph": "[ˋwɛpən]",
            "pos": "n.",
            "cn": "武器",
            "strategy": "諧音記憶法(外噴)",
            "mnemonic": "這把科技水槍是我的秘密武器，一射擊水柱就往外噴！",
            "ex": "The police found the hidden weapon in the suspect's car.",
            "grid": 2,
            "pos_idx": 2
          },
          {
            "en": "pilot",
            "ph": "[ˋpaɪlət]",
            "pos": "n.",
            "cn": "飛行員",
            "strategy": "諧音記憶法(拍樂得)",
            "mnemonic": "帥氣的飛行員在開飛機時，還不忘用拍立得（拍樂得）相機自拍。",
            "ex": "The pilot safely landed the airplane during the heavy storm.",
            "grid": 2,
            "pos_idx": 3
          },
          {
            "en": "extraordinary",
            "ph": "[ɪkˋstrɔrdṇ͵ɛrɪ]",
            "pos": "adj.",
            "cn": "非凡的",
            "strategy": "字根字首拆解(extra超出 + ordinary普通的)",
            "mnemonic": "這隻鳥擁有非凡的天賦，能做出遠遠超出（extra）普通（ordinary）鳥類的特技表演！",
            "ex": "The young magician has an extraordinary talent for magic tricks.",
            "grid": 2,
            "pos_idx": 4
          },
          {
            "en": "believe it or not",
            "ph": "[bɪˋliv ɪt ɔr nɑt]",
            "pos": "phr.",
            "cn": "信不信由你",
            "strategy": "圖像記憶法(貓咪不吃甜)",
            "mnemonic": "信不信由你，高傲的貓咪其實一輩子都嚐不出甜的味道。",
            "ex": "Believe it or not, cats cannot taste sweet things.",
            "grid": 2,
            "pos_idx": 5
          },
          {
            "en": "get over",
            "ph": "[gɛt ˋovɚ]",
            "pos": "phr.",
            "cn": "從……恢復",
            "strategy": "圖像記憶法(跨越障礙)",
            "mnemonic": "雖然跌倒受傷很痛，但只要勇敢跨過去（over），就能從傷痛中恢復並走出來。",
            "ex": "Although Maggie was sad about her breakup, she soon got over it.",
            "grid": 2,
            "pos_idx": 6
          },
          {
            "en": "make A into B",
            "ph": "[mek A ˋɪntu B]",
            "pos": "phr.",
            "cn": "把A變成B",
            "strategy": "圖像記憶法(神奇魔術師)",
            "mnemonic": "神奇魔術師大顯身手，竟然把一條平凡的長棍麵包（A）變成了一隻活生生的可愛鴿子（B）。",
            "ex": "The producer made the baker’s story into a TV drama.",
            "grid": 2,
            "pos_idx": 7
          }
        ];

        // 轉換 GitHub 圖片網址
        const imageUrls = {
            1: "https://raw.githubusercontent.com/terenceylhc/vocB2/main/B2L5G1.jpg",
            2: "https://raw.githubusercontent.com/terenceylhc/vocB2/main/B2L5G2.jpg"
        };

        // 發音功能
        const synth = window.speechSynthesis;
        function speakWord(word, event) {
            if (event) {
                event.stopPropagation();
            }
            if (synth.speaking) {
                synth.cancel();
            }
            const utterThis = new SpeechSynthesisUtterance(word);
            utterThis.lang = 'en-US';
            utterThis.rate = 0.9;
            synth.speak(utterThis);
        }

        const gridContainer = document.getElementById('card-grid');

        vocabData.forEach((item, index) => {
            const col = item.pos_idx % 4;
            const row = Math.floor(item.pos_idx / 4);
            const bgPosX = col * (100 / 3);
            const bgPosY = row * (100 / 3);
            const imageUrl = imageUrls[item.grid];

            // 加入 h-full 確保在 stretch 排版下，卡片容器會填滿列高
            const cardHTML = `
                <div class="flip-card-container w-full h-full" onclick="this.classList.toggle('flipped'); if(this.classList.contains('flipped')) { speakWord('${item.en}'); }">
                    
                    <!-- 正面呈現 -->
                    <div class="flip-card-face flip-card-front bg-white rounded-[28px] shadow-[0_12px_30px_rgba(0,0,0,0.08)] flex flex-col h-full overflow-hidden">
                        <div class="w-full aspect-video relative overflow-hidden flex-shrink-0">
                            <div class="w-full h-full sprite-img absolute top-0 left-0" 
                                 style="background-image: url('${imageUrl}'); background-position: ${bgPosX}% ${bgPosY}%;">
                            </div>
                        </div>
                        
                        <!-- flex-1 會讓文字區域彈性拉伸填滿剩餘高度，解決相鄰卡片高度不一的視覺問題 -->
                        <div class="flex-1 flex flex-col justify-center items-center p-6 bg-white min-h-[120px]">
                            <h2 class="text-[#0f172a] text-[2.5rem] font-black leading-none text-center">${item.en}</h2>
                            <div class="flex items-center justify-center gap-3 mt-3">
                                <span class="text-[#64748b] text-[1.1rem]">${item.ph}</span>
                                <button onclick="speakWord('${item.en}', event)" class="text-blue-500 hover:text-blue-600 transition-colors transform hover:scale-110" aria-label="聆聽發音">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" viewBox="0 0 20 20" fill="currentColor">
                                        <path fill-rule="evenodd" d="M9.383 3.076A1 1 0 0110 4v12a1 1 0 01-1.707.707L4.586 13H2a1 1 0 01-1-1V8a1 1 0 011-1h2.586l3.707-3.707a1 1 0 011.09-.217zM14.657 2.929a1 1 0 011.414 0A9.972 9.972 0 0119 10a9.972 9.972 0 01-2.929 7.071 1 1 0 01-1.414-1.414A7.971 7.971 0 0017 10c0-2.21-.894-4.208-2.343-5.657a1 1 0 010-1.414zm-2.829 2.828a1 1 0 011.415 0A5.983 5.983 0 0115 10a5.984 5.984 0 01-1.757 4.243 1 1 0 01-1.415-1.415A3.984 3.984 0 0013 10a3.983 3.983 0 00-1.172-2.828 1 1 0 010-1.415z" clip-rule="evenodd" />
                                    </svg>
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- 反面呈現 -->
                    <div class="flip-card-face flip-card-back bg-white rounded-[28px] shadow-[0_12px_30px_rgba(0,0,0,0.08)] flex flex-col justify-center p-8 h-full">
                        <div class="flex flex-col gap-6">
                            <div>
                                <h2 class="text-[#0f172a] text-[3.2rem] font-black leading-tight">${item.en}</h2>
                                <div class="flex flex-wrap items-center gap-4 mt-2">
                                    <span class="bg-[#e2e8f0] text-[#475569] px-4 py-1.5 rounded-full text-[1.1rem] font-bold italic shadow-sm">${item.pos}</span>
                                    <span class="text-[1.6rem] font-bold text-gray-800">${item.cn}</span>
                                </div>
                            </div>
                            <div class="flex flex-col gap-3">
                                <div class="text-gray-600 font-semibold text-lg flex items-center gap-2">
                                    💡 策略：<span>${item.strategy}</span>
                                </div>
                                <div class="bg-[#ff9800] text-white rounded-[20px] p-5 text-[1.3rem] font-bold leading-relaxed shadow-[inset_0_2px_4px_rgba(0,0,0,0.1)]">
                                    ${item.mnemonic}
                                </div>
                            </div>
                            <div class="border-t-[1.5px] border-dashed border-gray-300 pt-5 mt-2">
                                <p class="text-[1.25rem] text-gray-500 italic leading-relaxed">
                                    "${item.ex}"
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            gridContainer.insertAdjacentHTML('beforeend', cardHTML);
        });
    </script>
</body>
</html>
