<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>正在大改造中 | 敬請期待</title>
    <!-- 引入 Tailwind CSS 用於快速佈局 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Lucide 圖示庫 -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @keyframes blob {
            0% { transform: translate(0px, 0px) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
            100% { transform: translate(0px, 0px) scale(1); }
        }
        .animate-blob {
            animation: blob 7s infinite;
        }
        .animation-delay-2000 {
            animation-delay: 2s;
        }
        .animation-delay-4000 {
            animation-delay: 4s;
        }
        
        body {
            background-color: #F0F7FF;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        .social-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 3rem;
            height: 3rem;
            background-color: white;
            color: #94a3b8;
            border-radius: 1rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            transition: all 0.3s;
        }

        .social-icon:hover {
            color: white;
            transform: translateY(-0.5rem);
        }

        .hover-sky:hover { background-color: #38bdf8; }
        .hover-pink:hover { background-color: #ec4899; }
        .hover-slate:hover { background-color: #1e293b; }
        .hover-emerald:hover { background-color: #10b981; }
    </style>
</head>
<body class="relative min-h-screen w-full flex items-center justify-center">

    <!-- 裝飾性背景元素 - 漂浮的圓圈 -->
    <div class="absolute inset-0 z-0 overflow-hidden pointer-events-none">
        <div class="absolute top-[10%] left-[15%] w-32 h-32 bg-yellow-200 rounded-full mix-blend-multiply filter blur-xl opacity-70 animate-blob"></div>
        <div class="absolute top-[20%] right-[20%] w-40 h-40 bg-pink-200 rounded-full mix-blend-multiply filter blur-xl opacity-70 animate-blob animation-delay-2000"></div>
        <div class="absolute bottom-[20%] left-[25%] w-36 h-36 bg-purple-200 rounded-full mix-blend-multiply filter blur-xl opacity-70 animate-blob animation-delay-4000"></div>
    </div>

    <!-- 底部波浪裝飾 -->
    <div class="absolute bottom-0 left-0 w-full leading-[0] z-0">
        <svg viewBox="0 0 1440 320" class="w-full h-auto">
            <path 
                fill="#3B82F6" 
                fill-opacity="1" 
                d="M0,192L48,197.3C96,203,192,213,288,229.3C384,245,480,267,576,250.7C672,235,768,181,864,181.3C960,181,1056,235,1152,234.7C1248,235,1344,181,1392,154.7L1440,128L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"
            ></path>
        </svg>
    </div>

    <!-- 主要內容區塊 -->
    <main class="relative z-10 flex flex-col items-center text-center px-6">
        
        <!-- 插畫角色 / 圖示組合 -->
        <div class="relative mb-10 group">
            <div class="w-32 h-32 bg-white rounded-full flex items-center justify-center shadow-2xl transition-transform duration-500 hover:scale-110">
                <div class="relative">
                    <i data-lucide="construction" class="w-16 h-16 text-blue-500 animate-bounce"></i>
                    <div class="absolute -top-4 -right-4 rotate-12">
                        <i data-lucide="hard-hat" class="w-10 h-10 text-yellow-500"></i>
                    </div>
                </div>
            </div>
            <!-- 裝飾小方塊 -->
            <div class="absolute -top-2 -left-2 w-6 h-6 bg-yellow-400 rounded-md rotate-12 animate-pulse"></div>
            <div class="absolute -bottom-2 -right-2 w-8 h-8 bg-blue-400 rounded-full animate-bounce"></div>
        </div>

        <!-- 文字標題 -->
        <div class="space-y-4">
            <h1 class="text-5xl sm:text-7xl font-black text-slate-800 tracking-tight">
                正在大改造中 <span class="inline-block animate-pulse text-blue-500">!</span>
            </h1>
            <p class="text-xl sm:text-2xl font-bold text-slate-500">
                很快就會和大家見面了。
            </p>
        </div>

        <!-- 描述文字 -->
        <p class="mt-8 text-slate-400 max-w-md font-medium leading-relaxed">
            我們正在努力完善網站的每一個細節，<br />
            為了帶給你最棒的體驗，請再稍等一下下！
        </p>

        <!-- 社交媒體按鈕 -->
        <div class="mt-12 flex gap-6">
            <a href="#" class="social-icon hover-sky"><i data-lucide="twitter"></i></a>
            <a href="#" class="social-icon hover-pink"><i data-lucide="instagram"></i></a>
            <a href="#" class="social-icon hover-slate"><i data-lucide="github"></i></a>
            <a href="#" class="social-icon hover-emerald"><i data-lucide="globe"></i></a>
        </div>

        <!-- 頁尾小字 -->
        <div class="mt-20">
            <p class="text-white text-sm font-bold tracking-widest uppercase opacity-80">
                © 2026 Your Brand Studio
            </p>
        </div>
    </main>

    <script>
        // 初始化 Lucide 圖示
        lucide.createIcons();
    </script>
</body>
</html>
