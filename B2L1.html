<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B2L1 黃金比例單字卡</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 3D 翻轉效果 */
        .perspective-1000 {
            perspective: 1000px;
        }
        .preserve-3d {
            transform-style: preserve-3d;
        }
        .backface-hidden {
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }
        .rotate-y-180 {
            transform: rotateY(180deg);
        }
        .card-inner {
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .flipped {
            transform: rotateY(180deg);
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen py-12 px-4 md:px-8">

    <header class="max-w-6xl mx-auto mb-16 text-center">
        <h1 class="text-5xl font-black text-[#2c3e50] mb-4 tracking-tighter">B2L1 黃金比例單字卡</h1>
        <div class="h-1.5 w-24 bg-blue-500 mx-auto rounded-full mb-6"></div>
        <p class="text-gray-500 font-medium italic">HTML 單一檔案版本 | 440% 加強型裁切</p>
    </header>

    <div id="card-container" class="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-12">
        <!-- 卡片將由 JavaScript 動態生成 -->
    </div>

    <script>
        const vocabularyData = [
            { en: "attraction", ph: "[əˋtrækʃən]", cn: "有吸引力的景點、事物", ex: "Jiufen is a very popular tourist attraction in Taiwan.", grid: 1, pos: 0, strategy: "諧音 (台語/國語)", mnemonic: "阿！扯(A-trac)到一頭金牛來吸引遊客。", pos_type: "n." },
            { en: "local", ph: "[ˋlokḷ]", cn: "當地的 / 當地人", ex: "Our hotel is close to the local beach. / Many of the locals were sleeping.", grid: 1, pos: 1, strategy: "諧音 (台語)", mnemonic: "當地的阿伯「摟扣」在乘涼。", pos_type: "adj. / n." },
            { en: "plain", ph: "[plen]", cn: "樸素的", ex: "Lady Gaga wore a plain dress to the party.", grid: 1, pos: 2, strategy: "聯想", mnemonic: "這件衣服像「平」原 (Plain) 一樣樸素。", pos_type: "adj." },
            { en: "counter", ph: "[ˋkaᴜntɚ]", cn: "櫃臺", ex: "People are waiting in front of the counter to get a free gift.", grid: 1, pos: 3, strategy: "諧音 (國語)", mnemonic: "在櫃檯「看她」結帳。", pos_type: "n." },
            { en: "hug", ph: "[hʌg]", cn: "擁抱", ex: "The couple hug each other every time they meet.", grid: 1, pos: 4, strategy: "諧音 (國語)", mnemonic: "「哈哥」在給哈利波特一個大擁抱。", pos_type: "vt." },
            { en: "pleased", ph: "[plizd]", cn: "高興的，滿意的", ex: "Ann was not pleased with her fries at the restaurant.", grid: 1, pos: 5, strategy: "諧音 (國語)", mnemonic: "拿到「普里茲」獎好高興。", pos_type: "adj." },
            { en: "mood", ph: "[mud]", cn: "心情，情緒", ex: "Justin is in a good mood because the long weekend is coming.", grid: 1, pos: 6, strategy: "諧音 (國語)", mnemonic: "心情好就去「牧」場看牛。", pos_type: "n." },
            { en: "unfairly", ph: "[ʌnˋfɛrlɪ]", cn: "不公平地", ex: "Daniel is angry about being treated unfairly by his boss.", grid: 1, pos: 7, strategy: "諧音 (國語)", mnemonic: "這「案非常」不公平，天秤歪掉了。", pos_type: "adv." },
            { en: "observe", ph: "[əbˋzɝv]", cn: "觀察", ex: "He started to observe the people in the store.", grid: 1, pos: 8, strategy: "諧音 (國語)", mnemonic: "阿伯樂在觀察美麗的蝴蝶。", pos_type: "vi.; vt." },
            { en: "customer", ph: "[ˋkʌstəmɚ]", cn: "顧客", ex: "The shop serves customers till 5 p.m. every day.", grid: 1, pos: 9, strategy: "諧音 (國語)", mnemonic: "顧客太多，百貨門口「卡死他媽」了。", pos_type: "n." },
            { en: "seem", ph: "[sim]", cn: "好像，似乎", ex: "Larry seems to have a new girlfriend.", grid: 1, pos: 10, strategy: "諧音 (國語)", mnemonic: "這「西」瓜看起來好像是真的，其實是蛋糕。", pos_type: "linking v." },
            { en: "reveal", ph: "[rɪˋvil]", cn: "揭露，透露", ex: "The news reveals that the convenience store will hold a special event.", grid: 1, pos: 11, strategy: "字根拆解", mnemonic: "除去(re-) 面紗(veil)，真相被揭露。", pos_type: "vt." },
            { en: "secret", ph: "[ˋsikrɪt]", cn: "祕密 / 祕密的", ex: "Helen is good at keeping secrets. / They found a secret gate.", grid: 1, pos: 12, strategy: "諧音 (台語)", mnemonic: "守住這個秘密守得很「水氣」。", pos_type: "n. / adj." },
            { en: "amazed", ph: "[əˋmezd]", cn: "感到驚奇的", ex: "I am really amazed by its new trick.", grid: 1, pos: 13, strategy: "諧音 (國語)", mnemonic: "看到「阿妹」唱歌，大家驚奇得掉下巴。", pos_type: "adj." },
            { en: "earn", ph: "[ɝn]", cn: "贏得，賺 (錢)", ex: "This earns him many friends.", grid: 1, pos: 14, strategy: "諧音 (國語)", mnemonic: "用力「恩」的一聲，賺到金幣。", pos_type: "vt." },
            { en: "café", ph: "[kəˋfe]", cn: "咖啡店", ex: "Let's meet at the café near the station.", grid: 1, pos: 15, strategy: "諧音 (國語)", mnemonic: "在「咖啡」店喝咖啡。", pos_type: "n." },
            { en: "euro", ph: "[ˋjᴜro]", cn: "歐元", ex: "The coffee costs three euros.", grid: 2, pos: 0, strategy: "諧音 (國語)", mnemonic: "「有肉」吃就要用歐元買。", pos_type: "n." },
            { en: "nationality", ph: "[͵næʃəˋnælətɪ]", cn: "國籍", ex: "What is your nationality?", grid: 2, pos: 1, strategy: "諧音 (國語)", mnemonic: "「奶昔拿去」給不同國籍的人喝。", pos_type: "n." },
            { en: "pay off", ph: "[pe ɔf]", cn: "得到好結果", ex: "Eva’s efforts to improve her grades finally paid off.", grid: 2, pos: 2, strategy: "諧音 (國語)", mnemonic: "努力「賠」到「光」，最後卻贏到翻倍。", pos_type: "phr." },
            { en: "right away", ph: "[raɪt əˋwe]", cn: "立刻，馬上", ex: "When the actor appeared, his fans ran to him right away.", grid: 2, pos: 3, strategy: "諧音 (國語)", mnemonic: "「萊特」兄弟「阿威」立刻起飛。", pos_type: "phr." },
            { en: "stand out", ph: "[stænd aʊt]", cn: "突出，出眾", ex: "The silver one stands out because it has the best camera.", grid: 2, pos: 4, strategy: "諧音 (國語)", mnemonic: "「死站在外面」的人最突出。", pos_type: "phr." },
            { en: "burst out", ph: "[bɝst aʊt]", cn: "突然……", ex: "The boy burst out laughing on the MRT.", grid: 2, pos: 5, strategy: "諧音 (國語)", mnemonic: "「巴士」撞「掉」牆壁，突然衝出來。", pos_type: "phr." },
            { en: "have nothing to do with", ph: "[hæv ˋnʌθɪŋ tə du wɪð]", cn: "與……無關", ex: "His job has nothing to do with that.", grid: 2, pos: 6, strategy: "諧音 (國語)", mnemonic: "這裡「拿不到」任何東西，與我關。", pos_type: "phr." }
        ];

        function speak(text) {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            window.speechSynthesis.speak(utterance);
        }

        const container = document.getElementById('card-container');

        vocabularyData.forEach((item, index) => {
            const gridUrl = item.grid === 1 
                ? "https://github.com/terenceylhc/vocB2/blob/main/B2L1G1.jpg?raw=true" 
                : "https://github.com/terenceylhc/vocB2/blob/main/B2L1G2.jpg?raw=true";

            const x = (item.pos % 4) * (100 / 3);
            const y = Math.floor(item.pos / 4) * (100 / 3);

            const card = document.createElement('div');
            card.className = "perspective-1000 cursor-pointer h-auto";
            
            card.innerHTML = `
                <div class="card-inner relative preserve-3d w-full h-full min-h-[500px]">
                    <!-- 正面 -->
                    <div class="absolute inset-0 bg-white rounded-[20px] shadow-lg overflow-hidden backface-hidden flex flex-col border-0">
                        <div class="w-full aspect-video overflow-hidden">
                            <div class="w-full h-full bg-no-repeat transition-transform duration-300"
                                 style="background-image: url('${gridUrl}'); background-size: 440%; background-position: ${x}% ${y}%; transform: scale(1.08);">
                            </div>
                        </div>
                        <div class="p-8 text-center flex-grow flex flex-col justify-center items-center">
                            <h2 class="text-4xl font-extrabold text-[#2c3e50] mb-3">${item.en}</h2>
                            <div class="flex items-center gap-4 text-gray-500">
                                <span class="text-xl font-mono bg-gray-100 px-3 py-1 rounded-md">${item.ph}</span>
                                <button class="speak-btn p-2 hover:bg-blue-50 rounded-full transition-colors">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-blue-500"><path d="M11 5L6 9H2v6h4l5 4V5z"></path><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- 反面 -->
                    <div class="absolute inset-0 bg-white rounded-[20px] shadow-lg overflow-hidden backface-hidden rotate-y-180 flex flex-col border-0">
                        <div class="p-8 flex flex-col h-full">
                            <div class="flex flex-col items-center justify-center text-center mb-8 pt-6">
                                <h2 class="text-5xl font-black text-[#2c3e50] mb-4 tracking-tight">${item.en}</h2>
                                <div class="flex items-baseline gap-2 justify-center">
                                    <span class="text-xl font-bold text-blue-400 italic">${item.pos_type}</span>
                                    <p class="text-3xl text-blue-600 font-bold">${item.cn}</p>
                                </div>
                            </div>
                            
                            <div class="flex-grow space-y-6">
                                <div class="text-center">
                                    <div class="inline-flex items-center gap-2 px-4 py-1 bg-yellow-100 rounded-full mb-2">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-yellow-600"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A5 5 0 0 0 8 8c0 1.3.5 2.6 1.5 3.5.8.8 1.3 1.5 1.5 2.5"></path><path d="M9 18h6"></path><path d="M10 22h4"></path></svg>
                                        <span class="text-sm font-black text-yellow-700 uppercase tracking-widest">記憶策略</span>
                                    </div>
                                    <p class="text-[#2c3e50] text-xl font-bold">${item.strategy}</p>
                                </div>
                                
                                <div class="bg-orange-500 text-white p-6 rounded-2xl shadow-md transform rotate-[-0.5deg]">
                                    <p class="font-bold text-xl leading-relaxed text-center">${item.mnemonic}</p>
                                </div>
                            </div>

                            <div class="mt-8 pt-4 border-t border-gray-100">
                                <p class="text-gray-500 italic leading-snug text-base text-center">${item.ex}</p>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            // 綁定點擊翻轉事件
            card.addEventListener('click', () => {
                card.querySelector('.card-inner').classList.toggle('flipped');
            });

            // 綁定發音按鈕事件
            card.querySelector('.speak-btn').addEventListener('click', (e) => {
                e.stopPropagation();
                speak(item.en);
            });

            container.appendChild(card);
        });
    </script>
</body>
</html>
